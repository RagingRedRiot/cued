name: Release

# Publishes the binaries users download: pushing a version tag (v0.2.0) builds
# a static x86_64 cued and the cued-gui status window, and attaches both, with
# their checksums, to a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match Cargo.toml's version and point at a commit on main, so
# only code that passed CI and review is released.
#
# Asset names carry no version, so
# releases/latest/download/cued-x86_64-linux.tar.gz always names the newest
# release (and likewise cued-gui-x86_64-linux.tar.gz). That URL skips prereleases, so releases are never marked as one.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  ASSET: cued-x86_64-linux.tar.gz
  GUI_ASSET: cued-gui-x86_64-linux.tar.gz

jobs:
  # Read-only token: building runs every dependency's build script. Only the
  # publish job below can write, and it runs nothing from the repository.
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # main's history, for the ancestry check.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Tag matches Cargo.toml and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "cued") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
      # musl-gcc compiles the bundled SQLite; musl links it all statically, so
      # the binary runs on any distribution's libc.
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      # No rust-cache: a clean build, with nothing restored from another run.
      # Default features only, so no test-hooks fault points.
      - run: cargo build --release --locked --target "$TARGET"
      - name: Binary is static
        run: |
          set -euo pipefail
          file "target/$TARGET/release/cued"
          file "target/$TARGET/release/cued" | grep -q 'static'
      # The cross-user access fixture (DESIGN.md §7.1), against the exact
      # binary being shipped.
      - run: scripts/security/run.sh "target/$TARGET/release/cued"
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p stage dist
          cp "target/$TARGET/release/cued" LICENSE README.md stage/
          tar -C stage -czf "dist/$ASSET" cued LICENSE README.md
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          cat "dist/$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The status window can't be static: it loads the desktop's OpenGL and
  # Wayland/X11 libraries at run time. Built on the oldest supported runner,
  # so it needs only that glibc (2.35) and runs on older distributions too.
  # Same read-only token as `build`; the tag checks there gate publishing.
  build-gui:
    name: build-gui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      # No rust-cache: a clean build, with nothing restored from another run.
      - run: cargo build --release --locked -p cued-gui
      - name: Binary runs and links only system libraries
        run: |
          set -euo pipefail
          ldd target/release/cued-gui
          target/release/cued-gui --version
      # The fonts are compiled in, so their licenses travel with the binary.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p stage dist
          cp target/release/cued-gui LICENSE README.md \
            crates/cued-gui/assets/fonts/Inter-LICENSE.txt \
            crates/cued-gui/assets/fonts/Phosphor-LICENSE.txt stage/
          tar -C stage -czf "dist/$GUI_ASSET" \
            cued-gui LICENSE README.md Inter-LICENSE.txt Phosphor-LICENSE.txt
          (cd dist && sha256sum "$GUI_ASSET" > "$GUI_ASSET.sha256")
          cat "dist/$GUI_ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-gui
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, build-gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-gui
          path: dist/
      # --verify-tag: publish only for the tag that triggered this run, never
      # create one. Fails if the release already exists, rather than replace
      # assets people may have verified.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes
