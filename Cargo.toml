[package]
name = "cued"
version.workspace = true
edition = "2024"
rust-version = "1.89"
description = "Durable per-user scheduling of one-off and recurring commands, reminders, and multi-step workflows"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "process",
    "signal",
    "fs",
    "io-util",
    "sync",
] }
toml = "0.8"
zbus = { version = "5.17.0", default-features = false, features = ["tokio"] }

[features]
# Deterministic fault points for the real-process tests (src/testhook.rs).
# Disabled by default; production release builds must omit this feature.
test-hooks = []

[dev-dependencies]
tempfile = "3"

# The desktop status window lives beside the CLI so it shares the protocol
# types. Its graphics stack stays in its own crate: `cargo build` here builds
# only `cued`, and the static release build never compiles eframe.
[workspace]
members = [".", "crates/cued-gui"]

# One version for both binaries: a release tag names them together.
[workspace.package]
version = "0.1.0"
