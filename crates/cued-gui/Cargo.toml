[package]
name = "cued-gui"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "A desktop status window for cued: what is running, waiting, and done, step by step"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
cued = { path = "../.." }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
jiff = "0.2"

[dev-dependencies]
egui_kittest = { version = "0.36.2", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
